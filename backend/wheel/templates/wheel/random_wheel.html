{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f9ff">
    <meta name="description" content="Spin a random number between a chosen range.">
    <title>Random Wheel</title>
    <link rel="stylesheet" href="{% static 'wheel/random_wheel.css' %}?v=9">
</head>
<body class="page-wheel">
    <div class="page-shell wheel-shell">
        <header class="topbar">
            <a class="brand" href="{% url 'home' %}" aria-label="Return to home page">
                <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
                    <circle cx="24" cy="24" r="20" />
                    <path d="M24 4v40M4 24h40M10 10l28 28M38 10 10 38" />
                    <circle class="wheel-hub" cx="24" cy="24" r="4" />
                </svg>
                <span>Random Wheel</span>
            </a>
            <nav class="top-nav" aria-label="Main navigation">
                <a class="top-link game-nav-link" href="{% url 'random_wheel' %}" aria-current="page">Random Number</a>
                <a class="top-link game-nav-link" href="{% url 'random_colour' %}">Random Colour</a>
                <a class="top-link game-nav-link" href="{% url 'random_anything' %}">Random Anything</a>
                <a class="top-link game-nav-link back-home-link" href="{% url 'home' %}">Back home <span aria-hidden="true">↗</span></a>
            </nav>
        </header>

        <main class="wheel-main">
            <section class="wheel-layout" aria-labelledby="wheel-title">
                <div class="wheel-decorations" aria-hidden="true">
                    <span class="decoration-number">8</span>
                    <span class="decoration-number">31</span>
                    <span class="decoration-number">4</span>
                    <span class="decoration-number">62</span>
                    <span class="decoration-number">17</span>
                    <span class="decoration-number">9</span>
                    <span class="decoration-wheel decoration-wheel-one"></span>
                    <span class="decoration-wheel decoration-wheel-two"></span>
                    <span class="decoration-wheel decoration-wheel-three"></span>
                </div>
                <div class="game-card" id="spinner">
                    <div class="card-heading">
                        <div>
                            <h1 id="wheel-title">Random Wheel</h1>
                            <p>Choose a range and spin.</p>
                        </div>
                    </div>

                    <div class="wheel-stage">
                        <span class="pointer" aria-hidden="true"></span>
                        <div class="wheel" aria-label="Random number wheel">
                            <div class="wheel-inner">
                                <span id="result" aria-live="polite">?</span>
                                <small>YOUR PICK</small>
                            </div>
                        </div>
                    </div>

                    <p id="status" class="status" role="status" aria-live="polite">Set your range, then give it a whirl.</p>

                    <div class="range-panel">
                        <div class="range-title">
                            <span>YOUR RANGE</span>
                            <span class="range-limit">1 — 200</span>
                        </div>
                        <div class="input-group">
                            <label for="minInput">
                                <span>FROM</span>
                                <input type="number" id="minInput" value="1" min="1" max="200" inputmode="numeric">
                            </label>
                            <span class="range-dash" aria-hidden="true">—</span>
                            <label for="maxInput">
                                <span>TO</span>
                                <input type="number" id="maxInput" value="200" min="1" max="200" inputmode="numeric">
                            </label>
                        </div>
                    </div>

                    <button id="spinBtn" class="spin-button" type="button">
                        <span>Spin my range</span>
                        <span class="button-arrow" aria-hidden="true">↗</span>
                    </button>
                    <button id="surpriseBtn" class="surprise-button" type="button">
                        Surprise me <span class="surprise-range">1–200</span>
                    </button>

                </div>
            </section>
        </main>
    </div>

    <script src="{% static 'wheel/script.js' %}" data-random-url="{% url 'random_number' %}" data-spin-sound="{% static 'wheel/spin.mp3' %}"></script>
</body>
</html>
