{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e7eff6">
    <meta name="description" content="Choose a random number, colour, or your own list of options.">
    <title>Random Wheel</title>
    <link rel="stylesheet" href="{% static 'wheel/home.css' %}?v=25">
</head>
<body class="page-home">
    <div class="page-shell home-shell">
        <header class="topbar">
            <a class="brand" href="{% url 'home' %}" aria-label="Random Wheel home">
                <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
                    <circle cx="24" cy="24" r="20" />
                    <path d="M24 4v40M4 24h40M10 10l28 28M38 10 10 38" />
                    <circle class="wheel-hub" cx="24" cy="24" r="4" />
                </svg>
                <span>Random Wheel</span>
            </a>
        </header>
        <main class="home-main">
            <div class="background-numbers" aria-hidden="true">
                <span class="background-flower">✿</span>
                <span class="background-flower">❀</span>
                <span class="background-flower">✽</span>
                <span class="background-flower">✾</span>
                <span class="background-flower">✿</span>
                <span class="background-flower">❀</span>
                <span class="background-flower">✽</span>
                <span class="background-flower">✾</span>
                <span class="background-flower">❀</span>
                <span class="background-flower">✿</span>
                <span class="background-wheel background-wheel-one"></span>
                <span class="background-wheel background-wheel-two"></span>
                <span class="background-wheel background-wheel-three"></span>
                <span class="background-wheel background-wheel-four"></span>
                <span class="background-wheel background-wheel-five"></span>
                <span class="background-wheel background-wheel-six"></span>
                <span class="background-wheel background-wheel-seven"></span>
                <span class="background-wheel background-wheel-eight"></span>
            </div>
            <section class="home-hero" aria-labelledby="home-title">
                <div class="home-logo" aria-hidden="true"></div>
                <h1 id="home-title">Random Wheel</h1>
                <p>What would you like the wheel to pick?</p>
                <div class="home-actions">
                    <a class="primary-button" href="{% url 'random_wheel' %}">Random Number</a>
                    <a class="primary-button secondary-choice" href="{% url 'random_colour' %}">Random Colour</a>
                    <a class="primary-button custom-choice" href="{% url 'random_anything' %}">Random Anything</a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
